<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveStyler 网页嵌入示例</title>
<style>body{margin:0;padding:24px;background:#eee;font-family:system-ui}.animation-host{max-width:1280px;margin:auto;border-radius:16px;overflow:hidden;background:#0b0a10}.animation-host iframe{display:block;width:100%;border:0}</style>
<div class="animation-host" id="livestyler-host"><iframe id="livestyler-animation" src="public/livestyler-animation/index.html" title="LiveStyler 产品演示" allow="autoplay; fullscreen" loading="lazy"></iframe></div>
<script>const host=document.getElementById('livestyler-host'),frame=document.getElementById('livestyler-animation');new ResizeObserver(()=>{frame.style.height=(host.clientWidth*9/16+70)+'px';}).observe(host);</script></html>

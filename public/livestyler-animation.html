// Web playback wrapper; drawing and timeline remain the Opus design.
(() => {
  const manual = new URLSearchParams(location.search).get('render') === '1';
  let frame = 0, base = 0, elapsed = 0, playing = false;
  let allowedPlaying = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(now) {
    if (!playing) return;
    elapsed = (now - base) / 1000;
    window.seek(elapsed % window.DURATION);
    frame = requestAnimationFrame(tick);
  }
  function play() {
    if (playing || manual || !allowedPlaying || document.hidden) return;
    playing = true;
    base = performance.now() - elapsed * 1000;
    frame = requestAnimationFrame(tick);
  }
  function pause() {
    if (!playing) return;
    elapsed = (performance.now() - base) / 1000;
    playing = false;
    cancelAnimationFrame(frame);
  }
  window.LiveStylerPlayer = {
    play, pause,
    restart() { pause(); elapsed = 0; window.seek(0); play(); },
    get playing() { return playing; }
  };
  window.addEventListener('message', event => {
    if (event.source !== parent || event.data?.type !== 'livestyler-playback') return;
    allowedPlaying = event.data.playing === true;
    if (allowedPlaying) play(); else pause();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pause(); else play();
  });
  if (!manual && allowedPlaying) { window.seek(0); play(); }
})();

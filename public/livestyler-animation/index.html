<!doctype html><html lang=zh><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>LiveStyler 播放器</title><style>html,body{margin:0;background:#0b0a10;color:#eee;font-family:'Microsoft YaHei',sans-serif}.wrap{max-width:min(100vw,calc((100vh - 70px)*16/9));margin:0 auto}.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}.stage iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}.bar{display:flex;gap:10px;align-items:center;padding:10px}button{background:#235ff5;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:15px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #b5a0ff}input[type=range]{flex:1}#tm{font-variant-numeric:tabular-nums;min-width:96px;text-align:right}input[type=range]{min-width:0}</style></head><body><div class=wrap><div class=stage id=st><iframe id=fr src=film.html title='LiveStyler 影片'></iframe></div><div class=bar><button id=pb aria-label='播放'>播放</button><button id=rb aria-label='重播'>重播</button><input id=sk type=range min=0 max=48 step=0.01 value=0 aria-label='时间轴'><span id=tm>0.00 / 48.00</span></div></div><audio id=au src=mix.wav preload=auto></audio><script>const D=48,fr=document.getElementById('fr'),st=document.getElementById('st'),au=document.getElementById('au'),pb=document.getElementById('pb'),rb=document.getElementById('rb'),sk=document.getElementById('sk'),tm=document.getElementById('tm');let playing=false,dragging=false,noAudio=false,clk=0,clk0=0,last=-1;function fit(){fr.style.transform='scale('+(st.clientWidth/1920)+')';}addEventListener('resize',fit);fit();function send(t){if(t===last)return;last=t;try{const w=fr.contentWindow;if(w.seek&&w.ready){w.seek(t);return;}}catch(e){}try{fr.contentWindow.postMessage({t:t},'*');}catch(e){}}function now(){return noAudio?(playing?clk+(performance.now()-clk0)/1000:clk):au.currentTime;}function show(t){if(!dragging)sk.value=t;tm.textContent=t.toFixed(2)+' / '+D.toFixed(2);send(t);}function setT(t){t=Math.min(D,Math.max(0,t));if(noAudio){clk=t;clk0=performance.now();}else{try{au.currentTime=t;}catch(e){}}show(t);}au.addEventListener('error',()=>{noAudio=true;});function play(){if(now()>=D-0.01)setT(0);playing=true;pb.textContent='暂停';pb.setAttribute('aria-label','暂停');if(noAudio){clk0=performance.now();}else{au.play().catch(()=>{noAudio=true;clk=au.currentTime||0;clk0=performance.now();});}requestAnimationFrame(loop);}function pause(){if(noAudio)clk=now();playing=false;au.pause();pb.textContent='播放';pb.setAttribute('aria-label','播放');}function loop(){if(!playing)return;let t=now();if(t>=D||(!noAudio&&au.ended)){t=D;show(t);pause();return;}show(t);requestAnimationFrame(loop);}pb.onclick=()=>playing?pause():play();rb.onclick=()=>{setT(0);play();};sk.addEventListener('input',()=>{dragging=true;const t=+sk.value;setT(t);dragging=false;});addEventListener('keydown',e=>{if(e.target===sk)return;if(e.code==='Space'){e.preventDefault();pb.click();}});addEventListener('message',e=>{if(e.data&&e.data.ready){last=-1;show(now());}});fr.addEventListener('load',()=>{fit();setTimeout(()=>{last=-1;show(now());},50);});</script></body></html>
